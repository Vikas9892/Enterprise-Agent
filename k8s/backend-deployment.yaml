apiVersion: v1
kind: ConfigMap
metadata:
  name: enterprise-agent-backend-config
  labels:
    app: enterprise-agent
    component: backend
data:
  LOG_LEVEL: "INFO"
  LOG_FORMAT: "json"
  METRICS_ENABLED: "true"
  LITELLM_MODEL: "gpt-4o"
  OTEL_SERVICE_NAME: "enterprise-agent-backend"
  MCP_SERVER_URL: "http://enterprise-agent-mcp:8001"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: enterprise-agent-backend
  labels:
    app: enterprise-agent
    component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: enterprise-agent
      component: backend
  template:
    metadata:
      labels:
        app: enterprise-agent
        component: backend
    spec:
      containers:
        - name: backend
          image: enterprise-agent-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: enterprise-agent-backend-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: enterprise-agent-secrets
                  key: database-url
                  optional: true
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: enterprise-agent-secrets
                  key: secret-key
                  optional: true
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1024Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: enterprise-agent-backend
  labels:
    app: enterprise-agent
    component: backend
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      name: http
  selector:
    app: enterprise-agent
    component: backend
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: enterprise-agent-backend-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: enterprise-agent-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Hexagon Base -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2"/>

  <!-- Outer Cybernetic Circuit Ring -->
  <polygon points="32,8 52,19 52,45 32,56 12,45 12,19" 
           fill="none" 
           stroke="url(#primaryGrad)" 
           stroke-width="2.5" 
           stroke-linejoin="round"
           filter="url(#glow)"/>

  <!-- Inner Swarm Core -->
  <polygon points="32,16 45,24 45,40 32,48 19,40 19,24" 
           fill="rgba(99, 102, 241, 0.18)" 
           stroke="#06b6d4" 
           stroke-width="1.8" 
           stroke-linejoin="round"/>

  <!-- Central Autonomous Agent Nucleus -->
  <circle cx="32" cy="32" r="5" fill="#38bdf8" filter="url(#glow)"/>

  <!-- Neural Connection Nodes -->
  <circle cx="32" cy="16" r="2.5" fill="#a78bfa" />
  <circle cx="45" cy="24" r="2.5" fill="#60a5fa" />
  <circle cx="45" cy="40" r="2.5" fill="#34d399" />
  <circle cx="32" cy="48" r="2.5" fill="#a78bfa" />
  <circle cx="19" cy="40" r="2.5" fill="#34d399" />
  <circle cx="19" cy="24" r="2.5" fill="#60a5fa" />

  <!-- Radiating Data Links -->
  <line x1="32" y1="27" x2="32" y2="18.5" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="36" y1="34" x2="43" y2="38.5" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="28" y1="34" x2="21" y2="38.5" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round"/>
</svg>
